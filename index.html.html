<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Caza Estrellas - Retro Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="limones.css"/>
  <script src="utils.js"></script>
</head>
<body onload="iniciar()">
  <div class="contenedor arcade-cabinet">
    <header>
      <h1 class="blink">Atrapar Limones</h1>
      <p class="subtitle">INSERT COIN TO PLAY</p>
      <h2 class="autor-tag">Player: Cristhian Fortis</h2>
    </header>

    <canvas id="areaJuego" width="600" height="400"></canvas>

    <div class="panel-stats">
      <div class="stat">PUNTAJE: <span id="txtPuntaje">0</span></div>
      <div class="stat">VIDAS: <span id="txtVidas">3</span></div>
    </div>

    <div class="botones arcade-controls">
      <button class="arcade-btn red" onclick="moverIzquierda();">
        <span class="btn-top">Izquierda</span>
      </button>
      
      <button class="arcade-btn blue">
        <span class="btn-top">Reiniciar</span>
      </button>
      
      <button class="arcade-btn yellow" onclick="moverDerecha();">
        <span class="btn-top">Derecha</span>
      </button>
    </div>
  </div>
<script src="limones.js"></script>
</body>
</html>
